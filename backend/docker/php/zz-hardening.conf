; PHP-FPM pool hardening (web requests only; the CLI, i.e. artisan migrate and
; the AUTORUN boot tasks, is not affected). Added after the 2026-11 incident,
; where webshells ran commands through ?c= with system()/exec().
;
; The app does not use any of these functions in a web request (checked:
; app/, routes/, config/ have no calls; MAIL_MAILER is smtp/log, not sendmail).
; If a feature ever needs one, move it to a queued job / artisan command
; instead of re-enabling it here.
;
; Same section name as the base image's pool (docker-php-serversideup-pool.conf),
; so these values are merged into that pool.
[${PHP_FPM_POOL_NAME}]
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec,proc_nice,dl
php_admin_flag[allow_url_include] = off
php_admin_flag[expose_php] = off
php_admin_value[open_basedir] = /var/www/html:/tmp
security.limit_extensions = .php
